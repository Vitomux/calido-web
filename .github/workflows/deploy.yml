name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: "22"
        # withastro/action's own last internal step already runs
        # actions/upload-pages-artifact@v3 on ./dist with the default artifact
        # name — an explicit upload-pages-artifact step here duplicated that
        # under the same name, causing a 409 Conflict ("an artifact with this
        # name already exists on the workflow run"). Confirmed against the
        # action's real action.yml (v3 tag), not assumed.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
